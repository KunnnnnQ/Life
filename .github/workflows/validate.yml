name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Schema, graph and DOI checks
        run: python scripts/validate.py --online
      - name: INDEX.md is up to date
        run: |
          python scripts/build.py
          git diff --exit-code INDEX.md || (echo "INDEX.md is stale: run python scripts/build.py and commit it" && exit 1)
