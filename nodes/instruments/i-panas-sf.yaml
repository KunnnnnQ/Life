id: instrument.i-panas-sf
type: instrument
name: { zh: 国际版 PANAS 短表, en: I-PANAS-SF }
summary: PANAS 的 10 项英语跨文化短版，分别测量正性和负性情感；用于短时体验评估前需明确语言版本和测量时间框架。
status: reviewed
relations:
  - { type: derived_from, target: instrument.panas }
  - { type: measures, target: construct.positive-affect, evidence: [{ source: source.thompson-2007, stance: supports, level: validation-study }] }
  - { type: measures, target: construct.negative-affect, evidence: [{ source: source.thompson-2007, stance: supports, level: validation-study }] }
  - { type: related_to, target: instrument.i-panas-sf-zh-9, note: Liu 等（2020）支持的中文删题版，不能与本节点的英语 10 题版混用。, evidence: [{ source: source.liu-2020-i-panas-sf-chinese, stance: supports, level: validation-study, locator: Results — Factorial structure }] }
instrument:
  items: 10
  response_format: 5 点评分
  administration_minutes: 1
  subscales:
    - { name: 正性情感, items: 5, measures: construct.positive-affect }
    - { name: 负性情感, items: 5, measures: construct.negative-affect }
  languages:
    - { lang: en, validated: "yes", source: source.thompson-2007 }
    - { lang: zh, validated: unknown, source: source.liu-2020-i-panas-sf-chinese, note: 本节点保持原版 10 题。Liu 等（2020）最终支持删去 alert 的中文 9 题版，见 instrument.i-panas-sf-zh-9；不能据此把中文 10 题版标为已验证。 }
  license:
    status: unknown
    commercial_use: unknown
  items_in_repo: false
product_use:
  role: research-only
  when: 研究方案确定语言版本、题数和时间框架之后，作为候选测量工具。
  not_for: 不把一般情绪频率得分直接解释成五分钟内的状态变化；不混用 9 题与 10 题版本。
  classroom_priority: 非课堂原型必填；当前先用简短即时反馈，量表前后测方案另行预试。
