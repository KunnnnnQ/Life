id: strategy.reappraisal
type: strategy
name: { zh: 认知重评, en: Reappraisal }
summary: 换一种方式理解当前情境，例如把挫折看作信息或成长机会。
status: reviewed
relations:
  - type: part_of
    target: strategy.cognitive-change
  - type: targets
    target: construct.core-affect
    evidence:
      - { source: source.webb-2012, stance: supports, level: meta-analysis }
claims:
  - statement: 面对低强度负面刺激时，人们更倾向选择重评；高强度时更倾向分心。
    evidence:
      - { source: source.sheppes-2011, stance: supports, level: single-study }
caveats:
  - 研究中的重评由被试本人进行。让用户“看着角色重评”是替代性重评，效果尚无直接证据。
