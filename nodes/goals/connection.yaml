id: goal.connection
type: goal
name: { zh: 想和人聊聊, en: Connection }
summary: 用户不想看故事，只想和一个真实的人说说话，或者听别人说。
status: draft
relations:
  - { type: targets, target: construct.interpersonal-closeness, note: 产品定义的目标方向。 }
  - { type: targets, target: construct.valence }
claims:
  - statement: 人们预期和陌生人交谈不如独处，但实际交谈后的体验更积极。
    evidence:
      - { source: source.epley-schroeder-2014, stance: supports, level: single-study, note: 论文包含多个实验。 }
  - statement: 和不太熟的人互动越多，当天的幸福感越高。
    evidence:
      - { source: source.sandstrom-dunn-2014, stance: supports, level: single-study, note: 相关研究。 }
  - statement: 陌生人按一组逐步加深的自我暴露问题对话，比闲聊产生更强的亲近感。
    evidence:
      - { source: source.aron-1997, stance: supports, level: single-study, note: 面对面实验，约 45 分钟；匿名文字聊天和更短的时长下效果未知。 }
caveats:
  - 研究中的陌生人交谈多为面对面、在日常场景中发生，和匿名线上文字聊天差别很大。
product_use:
  ui_label: 想和人聊聊
  sub_choices: [想说说话, 愿意听别人说, 随便闲聊]
  target_shift: { valence: up, arousal: any }
  default_measure: instrument.affective-slider
  research_measure: instrument.ios-scale
