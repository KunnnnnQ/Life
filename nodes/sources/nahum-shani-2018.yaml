id: source.nahum-shani-2018
type: source
name: { zh: 即时自适应干预的组成与设计原则, en: Just-in-Time Adaptive Interventions (JITAIs) in Mobile Health }
summary: 提出按变化中的状态和情境选择支持的设计框架，区分目标、决策时点、候选内容、适配变量和决策规则，并讨论负担与缺失数据。
status: draft
citation:
  kind: journal-article
  authors: ["Nahum-Shani, I.", "Smith, S. N.", "Spring, B. J.", "Collins, L. M.", "Witkiewitz, K.", "Tewari, A.", "Murphy, S. A."]
  year: 2018
  title: "Just-in-Time Adaptive Interventions (JITAIs) in Mobile Health: Key Components and Design Principles for Ongoing Health Behavior Support"
  venue: Annals of Behavioral Medicine
  volume: 52
  issue: 6
  pages: 446-462
  doi: 10.1007/s12160-016-9830-8
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5364076/
caveats:
  - 这是设计框架，不能用于声称本项目的选择算法已有疗效。
  - 原文明确指出许多理论缺少时间尺度信息；没有给出童年经历、年龄或近期事件的通用衰减系数。
  - 参与程度和干预疲劳需要考虑，但参与程度不能替代本次目标的实际结果。
